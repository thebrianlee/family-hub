name: Bug report
description: Something in Family Hub does not behave the way the screen says it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what the screen did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to see it again. Leave out real names, calendar links, and PINs.
      placeholder: |
        1. Open Today
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Docker image built from main
  - type: dropdown
    id: how
    attributes:
      label: How you run it
      options:
        - Docker Compose
        - npm run dev
        - Other
