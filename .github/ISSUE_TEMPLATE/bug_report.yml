name: Bug report
description: Something in Family Hub does not work the way the screen says it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out real names, calendar links, tokens, PINs and family photos.
        **Security problem?** Do not file it here. Use the "Report a security problem" link on the new-issue page instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what the screen did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      placeholder: |
        1. Open Today
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How you run it
      options:
        - Docker Compose on a PC or Mac
        - Docker Compose on a Raspberry Pi
        - npm run dev
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Run `git log -1 --oneline` in the family-hub folder.
      placeholder: "a1b2c3d Fix ..."
  - type: input
    id: device
    attributes:
      label: Screen and browser
      placeholder: "Kitchen touchscreen with Chromium, or a phone with Safari"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Output of `docker compose logs --tail 100`. Check it for names and links before pasting.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed real names, calendar links, tokens, PINs and photos from this report.
          required: true
